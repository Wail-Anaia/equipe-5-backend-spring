spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/student_projects_db
    username: ${DB_USER:postgres}
    password: ${DB_PASS:2209}
    hikari:
      maximum-pool-size: 10
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate          # En prod : validate. En dev initial : update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  jwt:
    secret: ${JWT_SECRET:ce-secret-doit-avoir-au-moins-256bits-pour-HS256-securite-maximale}
    expiration-ms: 3600000        # 1 heure
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:4200}

logging:
  level:
    ma.jobintech: DEBUG
    org.springframework.security: INFO